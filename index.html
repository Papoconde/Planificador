<html lang="es">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;touch-action:manipulation;-webkit-text-size-adjust:100%}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f1ea;color:#1c2b4a;font-size:14px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.side{width:230px;background:#f3f2ef;border-right:1px solid #e6e5e1;padding:18px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.side h2{font-size:17px;margin:4px 8px 2px}
.sync{font-size:11px;color:#9b9a97;margin:0 8px 14px}
#nav{display:flex;flex-direction:column}
.nav{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer;color:#37352f}
.nav:hover{background:#e6e5e1}
.nav.on{background:#e0dfdb;font-weight:600;box-shadow:inset 3px 0 0 #2383e2}
.nav.nueva{margin-top:14px;background:#2383e2;color:#fff;font-weight:600;text-align:center}
.main{flex:1;padding:28px 34px 90px;max-width:1120px;min-width:0}
.cover{height:120px;margin:-28px -34px 0}
.picon{width:68px;height:68px;border-radius:18px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:34px;margin:-22px 0 10px;position:relative;z-index:1}
.pbar{display:flex;gap:8px;justify-content:space-between;margin:0 0 12px;position:relative;z-index:3}
.cover.pcov{margin:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0 20px}
.pgrid .prop{display:flex;flex-direction:column;align-items:stretch;gap:4px;border:1px solid #e6e5e1;border-radius:10px;padding:10px 12px;background:#fff}
.cardbox{background:#fff;border:1px solid #e6e5e1;border-radius:12px;padding:14px 16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.dlg2{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;box-shadow:0 14px 40px rgba(0,0,0,.25);text-align:center}
.dlg2 h3{margin:0 0 6px;font-size:20px}
.fmtbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fmtb{font:inherit;font-size:16px;font-weight:600;padding:16px;border-radius:12px;border:2px solid #e6e5e1;background:#fff;cursor:pointer;color:#37352f}
.fmtb:hover{border-color:#2383e2;background:#eef5fd}
body.dark{background:#191919;color:#e8e6e1}
body.dark .side{background:#202020;border-color:#2f2f2f}
body.dark .nav{color:#e8e6e1}
body.dark .nav:hover{background:#2c2c2c}
body.dark .nav.on{background:#303030}
body.dark .item,body.dark .stat,body.dark .dc,body.dark .trow,body.dark .cardbox,body.dark .pgrid .prop,body.dark .btn,body.dark .fmtb,body.dark .dlg2{background:#232323;border-color:#333;color:#e8e6e1}
body.dark .day,body.dark .col{background:#202020}
body.dark .thead{border-color:#333}
body.dark .trow{border-color:#2c2c2c}
body.dark .trow:hover,body.dark .dc:hover{background:#2a2a2a}
body.dark .pill{background:#333;color:#e8e6e1}
body.dark .btn.on{background:#e8e6e1;color:#191919}
body.dark select,body.dark input,body.dark textarea{background:#1e1e1e;color:#e8e6e1;border-color:#333}
body.dark .mut,body.dark .stat span{color:#8a8880}
body.dark .tt,body.dark .ptitle,body.dark .body{color:#e8e6e1}
body.dark .picon{background:#232323}
body.dark .cover{opacity:.8}
body.dark .nav.nueva{color:#fff}
.wdlg{background:#fff;border-radius:18px;padding:24px;max-width:520px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.wbar{height:6px;background:#efefed;border-radius:99px;margin:10px 0 4px;overflow:hidden}
.wbar span{display:block;height:100%;background:#2383e2;border-radius:99px;transition:width .2s}
.wq{font-size:22px;margin:12px 0 4px}
.wopts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.wopt{font:inherit;padding:10px 14px;border-radius:999px;border:1px solid #e6e5e1;background:#fff;cursor:pointer;color:#37352f}
.wopt.on{background:#2383e2;color:#fff;border-color:#2383e2}
.wtxt{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #e6e5e1;border-radius:10px;margin:14px 0;box-sizing:border-box}
.wbtns{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
body.dark .wdlg{background:#232323;color:#e8e6e1}
body.dark .wopt{background:#232323;color:#e8e6e1;border-color:#333}
body.dark .wtxt{background:#1e1e1e;color:#e8e6e1;border-color:#333}
body.dark .wbar{background:#333}
.sumlist{display:grid;gap:6px;margin:12px 0}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:#f7f6f3;border-radius:10px}
body.dark .sumrow{background:#2a2a2a}
.ctx{position:fixed;background:#fff;border:1px solid #e6e5e1;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;z-index:20;min-width:230px;display:flex;flex-direction:column}
.ctx button{font:inherit;font-size:14px;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;color:#37352f}
.ctx button:hover{background:#f1f1ef}
.ctx .cxdel{color:#d44c47}
.cxrow{display:flex;flex-wrap:wrap;gap:4px;padding:6px}
.cxp{font-size:12px;border-radius:999px;padding:4px 10px;border:1px solid #e6e5e1;background:#fff}
.cxp.on{background:#2383e2;color:#fff;border-color:#2383e2}
body.dark .ctx{background:#232323;border-color:#333}
body.dark .ctx button{color:#e8e6e1}
body.dark .ctx button:hover{background:#2c2c2c}
.seg{position:relative;display:flex;width:100%;background:#efefed;border-radius:12px;padding:4px;margin:4px 0 18px;touch-action:none}
.segind{position:absolute;top:4px;bottom:4px;left:0;width:0;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .18s ease,width .18s ease}
.segb{position:relative;z-index:1;border:0;background:none;font:inherit;font-size:13px;flex:1;min-width:0;padding:8px 6px;border-radius:9px;cursor:pointer;color:#6b6a66;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:5px;row-gap:2px;white-space:nowrap;line-height:1.2}
.segb .dot{margin:0!important}
.segn{font-size:11px;color:#9b9a97}
@media(max-width:700px){.segn{flex-basis:100%;text-align:center}.segb{padding:9px 4px}}
.segb.on{color:#37352f;font-weight:600}
body.dark .seg{background:#2a2a2a}
body.dark .segind{background:#3a3a3a}
body.dark .segb{color:#8a8880}
body.dark .segb.on{color:#e8e6e1}
#main{touch-action:pan-y}
.navind{display:none;position:absolute;left:0;top:0;background:#e0dfdb;border-radius:16px;pointer-events:none;z-index:0;opacity:0;will-change:transform;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .15s}
body.dark .navind{background:#333}
@media(max-width:700px){.navind{display:block}#nav{touch-action:none}#nav .nav,#nav .nav.on{background:transparent!important;position:relative;z-index:1}}
.lift{transform:scale(1.035);box-shadow:0 12px 28px rgba(35,131,226,.28)!important;transition:transform .15s ease,box-shadow .15s ease;position:relative;z-index:2}
.dc.sel{outline:2px solid #2383e2;outline-offset:-2px}
.topbtn{position:fixed;top:14px;right:18px;z-index:12;font:inherit;font-size:14px;border:1px solid #e6e5e1;background:#fff;color:#37352f;border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06)}
body.dark .topbtn{background:#232323;color:#e8e6e1;border-color:#333}
.topbtn{padding:6px 10px;font-size:13px;top:10px;right:12px;box-shadow:none}
.ajuste{margin-top:auto;width:100%;color:#8a8880;font-size:13px}
@media(min-width:701px){.topbtn{display:none}.side{display:flex;flex-direction:column}}
@media(max-width:700px){.ajuste{display:none}.topbtn{background:none;border:0;box-shadow:none;padding:4px 6px;font-size:18px;color:#9b9a97;top:6px;right:8px}}
@media(max-width:700px){body.dark .topbtn{background:none;border-color:transparent}}
.fab{position:fixed;right:22px;bottom:22px;background:#2383e2;color:#fff;border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:600;box-shadow:0 6px 20px rgba(35,131,226,.35);cursor:pointer;z-index:4}
h1{font-size:32px;margin:0 0 4px;letter-spacing:-.025em;font-weight:800}
.sub{color:#9b9a97;font-size:13px;margin-bottom:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid #e0dfdb;background:#fff;cursor:pointer;color:#37352f}
.btn.on{background:#37352f;color:#fff;border-color:#37352f}
.btn.pri{background:#2383e2;color:#fff;border-color:#2383e2}
.btn.del{color:#d44c47}
.mut{color:#9b9a97;font-size:13px}
.grp{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-weight:700;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.item{background:#fff;border:1px solid #e6e5e1;border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:transform .12s,box-shadow .12s;display:flex;gap:10px;align-items:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.item.done{opacity:.5}
.item:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 20px}
.stat{background:#fff;border:1px solid #e6e5e1;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:#9b9a97}
.item .tt{font-weight:600;font-size:14.5px}
.tt{color:#37352f;text-decoration:none;cursor:pointer}
.tt:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:#efefed;color:#37352f;white-space:nowrap}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:8px;overflow-x:auto}
.day{background:#f3f2ef;border-radius:8px;padding:8px;min-height:180px}
.day h4{margin:0 0 8px;font-size:13px;color:#6b6a66;text-transform:capitalize}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:8px;overflow-x:auto}
.col{background:#f3f2ef;border-radius:8px;padding:8px;min-height:160px}
.col h4{margin:2px 2px 8px;font-size:13px;display:flex;justify-content:space-between}
.thead,.trow{display:grid;grid-template-columns:2.2fr 1.1fr 1fr 1fr;gap:10px;align-items:center;padding:10px 12px}
.thead{font-size:11px;color:#9b9a97;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e6e5e1}
.trow{border:1px solid #efefed;border-radius:12px;margin-bottom:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .12s,box-shadow .12s}
.trow:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.trow a.tt{font-weight:600}
.item,.trow,.chip,.dc,.col,.card,.tt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:12px;color:#9b9a97;font-weight:700;padding:4px}
.dc{background:#fff;border:1px solid #e6e5e1;border-radius:6px;min-height:96px;padding:6px;cursor:pointer}
.dc:hover{background:#faf9f7}
.dc .num{font-size:12px;color:#6b6a66;font-weight:700}
.chip{display:block;font-size:11px;padding:2px 6px;border-radius:4px;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.page-wrap{max-width:740px;margin:0 auto}
.ptitle{font-size:34px;font-weight:700;border:0;outline:none;width:100%;background:transparent;padding:6px 0;font-family:inherit;color:#37352f}
.prop{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #efefed}
.prop input,.prop select,.prop textarea{font:inherit;padding:6px 8px;border:1px solid #e6e5e1;border-radius:6px;width:100%;background:#fff;color:#37352f}
.body{width:100%;min-height:340px;font:inherit;font-size:15px;line-height:1.65;border:0;outline:none;resize:vertical;padding:14px 0;background:transparent;color:#37352f}

<body>
<div class="app">

  </aside>

</div>
<script>
document.addEventListener('selectstart',e=>{if(!e.target.closest||!e.target.closest('textarea,input,[contenteditable]'))e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(!e.target.closest||!e.target.closest('textarea,input,[contenteditable]'))e.preventDefault()});
const K=['t','h','g','sg','a','p','ty','pr','e','f','tv','hs','du','fr','d','n','fl','di','pu','cu','tr','hAt'];
const L={g:['Universidad','Redes','Personal','WithDesign'],sg:['🎬 Vídeos','📌 Otros','🖌️ Diseño'],a:['Inglés','Proyecto I','Infografía','Diseño crítico','Cultura visual'],p:['Alta','Media','Baja'],ty:['Obligatorio','⏩ Adelanto','Opcional','Entrega'],pr:['Idea','Por grabar','Grabado','Editado','Subido'],e:['Sin estado','Sin empezar','En curso','Listo'],f:['Reel','Carrusel'],tv:['Logo / curiosidad','Rebrand','Tipografía','Opinión','Reto','Personal']};
const PROPS=[
 {k:'t',l:'Tarea',type:'text'},{k:'h',l:'Hecho',type:'check'},
 {k:'g',l:'Grupo',type:'sel'},{k:'a',l:'Asignatura',type:'sel'},{k:'p',l:'Prioridad',type:'sel'},
 {k:'ty',l:'Tipo',type:'sel'},{k:'pr',l:'Progreso',type:'sel'},{k:'e',l:'Estado',type:'sel'},{k:'f',l:'Formato',type:'sel'},{k:'tv',l:'Tipo de vídeo',type:'sel'},
 {k:'hs',l:'Hashtags',type:'text'},{k:'du',l:'Duración',type:'text'},{k:'fr',l:'Franja',type:'text'},
 {k:'d',l:'Descripción',type:'area'},{k:'n',l:'Notas',type:'area'},
 {k:'fl',l:'Fecha límite',type:'date'},{k:'di',l:'Día',type:'date'},{k:'pu',l:'Publicación',type:'date'},
 {k:'cu',l:'Página',type:'pagina'}
];
const P={};PROPS.forEach(p=>P[p.k]=p);
const GC={Universidad:'#2383e2',Redes:'#e6007e',Personal:'#8d6e63',WithDesign:'#00acc1'};
const PRC={Idea:'#8e6fd6','Por grabar':'#9b9a97',Grabado:'#d9a20f',Editado:'#2383e2',Subido:'#0f7b6c'};
const SECS=[['resumen',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="url(#gi1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="gi1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fb8ff"/></linearGradient></defs><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>`,'Resumen'],['semana',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="url(#gi2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="gi2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fb8ff"/></linearGradient></defs><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>`,'Esta semana'],['todo',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="url(#gi3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="gi3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fb8ff"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg>`,'To Do'],['cal',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="url(#gi4)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="gi4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fb8ff"/></linearGradient></defs><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,'Calendario'],['redes',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="url(#gi5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="gi5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fb8ff"/></linearGradient></defs><rect x="3" y="10" width="18" height="11" rx="2.5"/><path d="M3 10V7.5a1.5 1.5 0 0 1 1.5-1.5h15A1.5 1.5 0 0 1 21 7.5V10z"/><path d="M7 6l3 4M12 6l3 4M17 6l2 3"/></svg>`,'Contenido Redes'],['completado',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="url(#gi6)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="gi6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fb8ff"/></linearGradient></defs><path d="M4 22V4M4 4h13l-2 4 2 4H4"/></svg>`,'Completado']];

const hoyD=new Date();
let calY=hoyD.getFullYear(), calM=hoyD.getMonth(), calG='Todos';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mon=(()=>{const d=new Date(hoyD);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)})();
const sun=(()=>{const d=new Date(mon+'T12:00:00');d.setDate(d.getDate()+6);return ymd(d)})();
const hace30=ymd(new Date(Date.now()-30*864e5));

let S=[], section='resumen', page=null, redesView='tablero', showIdeas=true, askId=null, askPu=null, dark=false, selDay=ymd(hoyD), sync='Solo en este dispositivo', ref=null, tm=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtD(v){if(!v)return '';const dt=new Date(v.slice(0,10)+'T12:00:00');let s=dt.toLocaleDateString('es-ES',{day:'numeric',month:'short'});return s}
function opts(list,cur){return list.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}
function selInl(o,field,list){return `<select data-field="${field}" data-id="${o.id}"><option value="">—</option>${opts(list,o[field]||'')}</select>`}
function fromArr(a,i){const o={id:'r'+i};K.forEach((k,j)=>{o[k]=a[j]==null?'':a[j]});o.h=!!o.h;if(!o.tr&&o.cu&&String(o.t).startsWith('🎙️ Pendiente de resumir')){o.tr=o.cu;o.cu=''}return o}
function toArr(o){return K.map(k=>k==='h'?(o.h?1:0):(o[k]||''))}
function persist(){
  const data={rows:S.map(toArr),bias:prioBiasData};
  try{localStorage.setItem('planner-v3',JSON.stringify(data))}catch(e){}
  if(sb&&sbUser)sbSave(data);
}
function saveSoon(){clearTimeout(tm);tm=setTimeout(persist,400)}
const act=()=>S.filter(o=>!o.h);
const gLabel=g=>g==='Universidad'?'Uni':(g||'Sin grupo');
const gc=g=>GC[g]||'#9b9a97';
const ACOL={'Inglés':'#e53935','Proyecto I':'#1e63d6','Infografía':'#9334e6','Diseño crítico':'#3d9e2e','Cultura visual':'#f2b705'};
const GCAL=[{d:'2026-11-14',t:'Bermu con Jorge y Gon',h:'12:00–13:00'},{d:'2026-11-20',t:'Curso novios',h:'21:35–22:35'},{d:'2026-12-09',t:'Cumple Yerko',h:'Todo el día'}];
const PCOL={Alta:'#d44c47',Media:'#d9a20f',Baja:'#8a8880'};
const ppill=o=>o.p?`<span title="${esc(o.p)}" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${PCOL[o.p]};margin-left:4px;vertical-align:middle;align-self:center"></span>`:'';
const ccol=o=>o.g==='Universidad'&&ACOL[o.a]?ACOL[o.a]:gc(o.g);
const ticon=(o,z)=>{if(o.g!=='Universidad')return '';const n=o.ty==='⏩ Adelanto'?'fwd':o.ty==='Entrega'?'upload':o.ty==='Opcional'?'opt':'';return n?ico(n,z||14)+' ':''};
function inWeek(o){return [o.di,o.fl].some(x=>x&&x.slice(0,10)>=mon&&x.slice(0,10)<=sun)}
const byFl=(a,b)=>(a.fl||'9999').localeCompare(b.fl||'9999');

function visibleKeys(d){
  const ks=['g','t','p'];
  if(d.g==='Universidad'){ks.push('a','ty','fl','di','fr');}
  else if(d.g==='Redes'){ks.push('pr','f','tv','n'); if(d.f)ks.push('d','hs','pu');}
  else if(d.g){ks.push('e','fl','di');}
  if(!ks.includes('d'))ks.push('d');
  ks.push('h','cu');
  return ks;
}

function frParts(v){const [a,b]=String(v||'').split('-');return [a||'',b||'']}
function frCtl(o,id){const [a,b]=frParts(o.fr);return `<div data-frw="${id}" style="display:flex;gap:8px;align-items:center"><input type="time" data-frp="0" value="${a}" style="width:auto"><span class="mut">→</span><input type="time" data-frp="1" value="${b}" style="width:auto"></div>`}
function card(o,hora){
  const ref=o.fl||o.di;
  const fd=(ref&&!hora)?new Date(ref.slice(0,10)+'T12:00:00'):null;
  const badge=(hora)?'':fd?`<div class="dbadge"><b>${fd.getDate()}</b><span>${esc(fd.toLocaleDateString('es-ES',{month:'short'}).replace('.',''))}</span></div>`:`<div class="dbadge"><b>—</b><span>sin</span></div>`;
  const strip=(o.g||o.a)?`border-left:4px solid ${ccol(o)};`:'';
  return `<div class="item ${o.h?'done':''}" ${hora?`data-wdrag="${o.id}"`:''} style="${strip}align-items:center">
    ${o.h?`<input type="checkbox" data-h="${o.id}" checked>`:''}${badge}
    <div style="flex:1;min-width:0"><a class="tt" data-open="${o.id}">${ticon(o)}${esc(String(o.t||'Sin título').replace(/^\s*(⏩|📤|⚪)\s*/,''))}</a>
    <div class="meta"><span class="pill gtag" style="background:rgba(127,127,127,.16);color:#c9c7c1;font-weight:600"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${gc(o.g)};margin-right:5px"></span>${esc(gLabel(o.g))}</span>${o.a?`<span class="pill">${esc(o.a)}</span>`:''}${ppill(o)}${o.pr?`<span class="pill" style="background:${PRC[o.pr]||'#efefed'}22">${esc(o.pr)}</span>`:''}${hora&&o.fr?`<span class="pill">🕒 ${esc(o.fr)}</span>`:''}</div></div></div>`;
}
function redCard(o){
  return `<div class="item ${o.h?'done':''}" style="border-left:4px solid ${PRC[o.pr]||'#c8c7c3'};display:block">
    <a class="tt" data-open="${o.id}">${esc(o.t||'Sin título')}</a>
    <div class="meta">${o.f?`<span class="pill">${esc(o.f)}</span>`:''}${o.tv?`<span class="pill">${esc(o.tv)}</span>`:''}${o.pu?`<span class="pill">📅 ${esc(fmtD(o.pu))}</span>`:''}</div>
    <div style="margin-top:8px">${selInl(o,'pr',L.pr)}</div></div>`;
}

function semanaHtml(){
  const dias=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const rows=act().filter(inWeek);
  const cols=dias.map((nombre,i)=>{
    const d=new Date(mon+'T12:00:00');d.setDate(d.getDate()+i);
    const key=ymd(d);
    const items=rows.filter(o=>((o.di||o.fl||'').slice(0,10))===key).sort((a,b)=>(a.fr||'').localeCompare(b.fr||''));
    return `<div class="day"><h4>${nombre} ${d.getDate()}</h4>${items.map(o=>card(o,true)).join('')||'<span class="mut">—</span>'}</div>`;
  }).join('');
  return `<h1>🔔 Esta semana</h1><div class="sub">Del ${fmtD(mon)} al ${fmtD(sun)}</div><div class="grid7">${cols}</div>`;
}

let todoOrden='grupo', todoMenu=false;
let todoGrp='__all';
const todoSeg=()=>{const nom={grupo:'Por grupo',reciente:'Más recientes arriba',fecha:'Por fecha'}[todoOrden];const ops=[['grupo','Por grupo'],['reciente','Más recientes arriba'],['fecha','Por fecha']];return `<div class="ordw"><button class="btn${todoMenu?' on':''}" data-tordmenu>⇅ Ordenar · ${nom}</button>${todoMenu?`<div class="ordop">${ops.map(([k,l])=>`<button class="btn${todoOrden===k?' on':''}" data-tord="${k}">${l}</button>`).join('')}</div>`:''}</div>`};
const filtGrupo=o=>todoGrp==='__all'||(o.g||'')===todoGrp;
/* buscador de To Do y Completado: busca en el título y la asignatura, sin importar mayúsculas ni tildes */
let qB={todo:'',done:''};
const qNorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const qOk=(o,k)=>{const q=qNorm((qB[k]||'').trim());return !q||qNorm((o.t||'')+' '+(o.a||'')).includes(q)};
/* icono de lupa compacto; al pulsarlo aparece el campo de texto a su lado */
let qOpen={todo:false,done:false};
/* la lupa abre el campo hacia la izquierda y lo cierra con la misma animación; la animación solo suena al abrir (no al escribir) */
let qNuevo={todo:false,done:false};
const qHtml=k=>{const open=qOpen[k]||!!qB[k];const anim=qNuevo[k]?' qin':'';const hay=!!qB[k];return `<div class="qrow">${open?`<input class="qsearch${anim}" data-qb="${k}" type="search" placeholder="Buscar una tarea…" value="${esc(qB[k]||'')}" autocomplete="off">`:''}${hay?`<button class="qclr" data-qclear="${k}">Borrar filtro</button>`:''}<button class="qbtn${open?' on':''}" data-qtoggle="${k}" aria-label="Buscar tarea" title="Buscar">${ico('search',18)}</button></div>`};
/* cierra el buscador con la animación inversa; se usa al pulsar la lupa o al quitarse el teclado */
const closeQ=k=>{const n=document.querySelector(`[data-qb="${k}"]`);if(n){if(n.classList.contains('qout'))return;n.classList.add('qout');setTimeout(()=>{qOpen[k]=false;qB[k]='';qNuevo[k]=false;render()},200);return}qOpen[k]=false;qB[k]='';render()};
document.addEventListener('focusout',e=>{const k=e.target.dataset&&e.target.dataset.qb;if(!k)return;setTimeout(()=>{const n=document.querySelector(`[data-qb="${k}"]`);if(!n||document.activeElement===n||qB[k])return;closeQ(k)},150)});
document.addEventListener('click',e=>{const c=e.target.closest('[data-qclear]');if(!c)return;closeQ(c.dataset.qclear)});
const qReset=()=>{qOpen={todo:false,done:false};qB={todo:'',done:''};qNuevo={todo:false,done:false}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-qtoggle]');if(!t)return;const k=t.dataset.qtoggle;const abierto=qOpen[k]||!!qB[k];
  if(abierto){if(qB[k]){const n=document.querySelector(`[data-qb="${k}"]`);if(n)n.focus();return}closeQ(k);return}
  qOpen[k]=true;qNuevo[k]=true;render();qNuevo[k]=false;const n=document.querySelector(`[data-qb="${k}"]`);if(n)n.focus()});
const PRIO_RANK={Alta:2,Media:1,Baja:0};
let prioBiasData=(()=>{try{return JSON.parse(localStorage.getItem('planPrioBias')||'{}')||{}}catch(e){return {}}})();
function prioBias(){return prioBiasData}
function prioScore(o){
  const ty=o.ty||'', g=o.g||'';
  let s=0;
  if(ty==='Obligatorio')s+=30; else if(ty==='Entrega')s+=25; else if(ty.includes('Adelanto'))s-=10;
  s+=({Alta:20,Media:10,Baja:0})[o.p]||0;
  if(g==='Universidad')s+=15;
  const f=(o.fl||o.di||'').slice(0,10);
  if(f){const dias=Math.round((new Date(f+'T12:00:00')-new Date(ymd(hoyD)+'T12:00:00'))/864e5);if(dias<=0)s+=40;else if(dias<=2)s+=30;else if(dias<=7)s+=15}
  s+=prioBias()[ty+'|'+g]||0;
  return s;
}
function learnPrio(o,prev,next){
  if(!(next in PRIO_RANK))return;
  const rk=v=>(v in PRIO_RANK)?PRIO_RANK[v]:-1;
  const d=rk(next)-rk(prev);if(!d)return;
  const b=prioBiasData,k=(o.ty||'')+'|'+(o.g||'');
  b[k]=Math.max(-20,Math.min(20,(b[k]||0)+5*d));
  try{localStorage.setItem('planPrioBias',JSON.stringify(b))}catch(e){}
}
function statsTodo(){
  const all=act().filter(o=>o.pr!=='Idea');
  const cnt=k=>all.filter(o=>(o.g||'')===k).length;
  const items=[['__all',all.length,'pendientes','#37352f']];
  [['Universidad','Universidad',GC.Universidad],['Personal','Personal',GC.Personal],['WithDesign','Diseño',GC.WithDesign],['Redes','Redes',GC.Redes],['','Sin grupo','#9b9a97']].forEach(([k,l,c])=>{const n=cnt(k);if(n>0)items.push([k,n,l,c])});
  return `<div class="stats">${items.map(([k,n,l,c])=>`<div class="stat" data-tgrp="${k}" style="cursor:pointer;${todoGrp===k?'outline:2px solid '+c+';outline-offset:-2px':''}"><b style="color:${c}">${n}</b><span>${l}</span></div>`).join('')}</div>`;
}
function recienteHtml(){
  const rows=act().filter(o=>o.pr!=='Idea'&&filtGrupo(o)&&qOk(o,'todo')).reverse();
  return `<div class="hdrq"><h1>✅ To Do</h1>${qHtml('todo')}</div><div class="sub">${rows.length} tareas · las últimas arriba</div>${todoSeg()}`+statsTodo()+(rows.map(o=>card(o)).join('')||'<p class="mut">No hay tareas con este filtro.</p>');
}
/* Por fecha: tareas desde hoy en adelante, ordenadas por su día; las que no tienen fecha van al final */
function fechaHtml(){
  const hoyS=ymd(hoyD);
  const f=o=>(o.di||o.fl||'').slice(0,10);
  const rows=act().filter(o=>o.pr!=='Idea'&&filtGrupo(o)&&qOk(o,'todo'));
  const con=rows.filter(o=>f(o)&&f(o)>=hoyS).sort((a,b)=>f(a).localeCompare(f(b))||(a.fr||'').localeCompare(b.fr||''));
  const sin=rows.filter(o=>!f(o));
  const cuerpo=con.map(o=>card(o)).join('')+sin.map(o=>card(o)).join('');
  return `<div class="hdrq"><h1>✅ To Do</h1>${qHtml('todo')}</div><div class="sub">Por fecha · desde hoy en adelante</div>${todoSeg()}`+(cuerpo||'<p class="mut">No hay tareas desde hoy en adelante.</p>');
}
function todoHtml(){
  if(todoOrden==='reciente')return recienteHtml();
  if(todoOrden==='fecha')return fechaHtml();
  const rows=act().filter(o=>o.pr!=='Idea'&&filtGrupo(o)&&qOk(o,'todo'));
  const grupos=[...Object.keys(GC),''];
  const stat=(n,l,c)=>`<div class="stat"><b style="color:${c}">${n}</b><span>${l}</span></div>`;
  const statsHtml=statsTodo();
  return `<div class="hdrq"><h1>✅ To Do</h1>${qHtml('todo')}</div><div class="sub">Pendientes por grupo · ＋ añadir</div>${todoSeg()}`+
    statsHtml+(rows.length?'':'<p class="mut">No hay tareas con este filtro.</p>')+grupos.map(g=>{
      const list=rows.filter(o=>(o.g||'')===g).sort((a,b)=>(prioScore(b)-prioScore(a))||byFl(a,b));
      if(!list.length)return '';
      return `<div class="grp"><span class="dot" style="background:${gc(g)}"></span>${gLabel(g)} <span class="mut">${list.length}</span>
        <button class="btn" style="margin-left:auto" data-newg="${g}">＋ añadir</button></div>`+
        (list.map(o=>card(o)).join('')||'<p class="mut">Sin tareas.</p>');
    }).join('');
}

function calHtml(){
  const first=new Date(calY,calM,1), off=(first.getDay()+6)%7, days=new Date(calY,calM+1,0).getDate();
  let cells=['L','M','X','J','V','S','D'].map(d=>`<div class="hd">${d}</div>`).join('');
  for(let i=0;i<off;i++)cells+='<div></div>';
  /* filtro por grupo: solo aparecen los grupos que tienen tareas activas; si el elegido se queda sin tareas vuelve a Todos */
  /* solo aparecen grupos con alguna tarea visible en este mes del calendario */
  const mesK=calY+'-'+String(calM+1).padStart(2,'0');
  const enMes=o=>(o.di||o.fl||'').slice(0,7)===mesK||(o.pu||'').slice(0,7)===mesK;
  const grupos=[...new Set(act().filter(enMes).map(o=>o.g).filter(Boolean))];
  if(calG!=='Todos'&&!grupos.includes(calG))calG='Todos';
  const rows=act().filter(o=>calG==='Todos'||o.g===calG);
  const gcalV=calG==='Todos'?GCAL:[];
  for(let d=1;d<=days;d++){
    const key=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    /* una entrada por tarea: si se publica ese día cuenta solo como publicación */
    const ent=[];
    rows.forEach(o=>{if(o.g==='Redes'&&(o.pu||'').slice(0,10)===key)ent.push({o,pub:true});else if((o.di||o.fl||'').slice(0,10)===key)ent.push({o,pub:false})});
    const ch=ent.map(({o,pub})=>pub?`<span class="chip pub" data-open="${o.id}" style="--c:${gc('Redes')};background:#fde7f2">🚀${esc(o.t||'')}</span>`:`<span class="chip" data-open="${o.id}" style="--c:${ccol(o)};background:${ccol(o)}22;border-left:3px solid ${ccol(o)}">${ticon(o)}${esc(String(o.t||'Sin título').replace(/^\s*(⏩|📤|⚪)\s*/,''))}</span>`).join('');
    /* móvil: un punto por tarea; si el día llega a 4 puntos se juntan los del mismo color y el número va debajo */
    const pts=ent.map(({o,pub})=>pub?gc('Redes'):ccol(o));
    gcalV.filter(e=>e.d===key).forEach(()=>pts.push('EV'));
    const junta=pts.length>=4;
    const cols=new Map();
    pts.forEach(c=>cols.set(c,(cols.get(c)||0)+1));
    const grp=junta?[...cols.entries()]:pts.map(c=>[c,1]);
    const dotsHtml=`<div class="dots">${grp.slice(0,3).map(([c,n])=>`<span class="dg"><i ${c==='EV'?'class="ev"':`style="background:${c}"`}></i>${junta&&n>1?`<b>${n}</b>`:''}</span>`).join('')}${grp.length>3?`<b class="mx">+${grp.length-3}</b>`:''}</div>`;
    cells+=`<div class="dc${key===selDay?' sel':''}" data-selday="${key}"><div class="num">${d}</div>${ch}${gcalV.filter(e=>e.d===key).map(e=>`<span class="chip gcal" style="--c:#bdbcb8;background:#f1f0ee;border-left:3px dashed #bdbcb8;color:#8a8880">${esc(e.t)}</span>`).join('')}${dotsHtml}</div>`;
  }
  const nombre=new Date(calY,calM,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  return `<h1>📆 Calendario</h1><div class="sub"><button class="btn" data-month="-1">‹</button><b style="color:inherit">${esc(nombre.charAt(0).toUpperCase()+nombre.slice(1).replace(' De ',' de '))}</b><button class="btn" data-month="1">›</button><span>· pulsa un día para crear una tarea</span></div>${grupos.length>1?`<div class="calfil"><button class="btn${calG==='Todos'?' on':''}" data-calg="Todos">Todos</button>${grupos.map(g=>`<button class="btn${calG===g?' on':''}" data-calg="${esc(g)}"><span class="dot" style="background:${gc(g)}"></span>${esc(gLabel(g))}</button>`).join('')}</div>`:''}<div class="cal">${cells}</div>${agendaHtml()}`;
}

  } else if(compG==='__all'){
    body=[...Object.keys(GC),''].map(g=>{const rows=done.filter(o=>(o.g||'')===g).sort(byRecC);if(!rows.length)return '';return `<div class="grp"><span class="dot" style="background:${gc(g)}"></span>${gLabel(g)} <span class="mut">${rows.length}</span></div>`+rows.map(o=>card(o)).join('')}).join('');

/* Copia flotante compartida por Esta semana y Contenido Redes:
   nace desde la pastilla original, se fija al dedo y al soltar vuela a su nuevo sitio */
function wdGhostOn(el,x,y){
  wdGhostOff();
  const r=el.getBoundingClientRect();
  const W=el.offsetWidth,H=el.offsetHeight;
  const g=document.createElement('div');g.className='wdghost';g.id='wdGhost';
  g._W=W;g._H=H;g._ox=r.left;g._oy=r.top;g._land=false;
  g.style.width=(W*.62)+'px';g.style.height=(H*.62)+'px';
  const inner=document.createElement('div');inner.className='wdin';inner.style.width=W+'px';
  /* replica los contenedores (columna, día, tablero) como cáscaras vacías sin fondo
     para que la tarjeta copiada conserve los mismos estilos que en su sitio */
  let cur=inner;const chain=[];let anc=el.parentElement;
  while(anc&&anc!==document.body&&chain.length<3){chain.unshift(anc);anc=anc.parentElement}
  chain.forEach(a=>{
    const s=a.cloneNode(false);s.removeAttribute('id');
    [...s.attributes].forEach(at=>{if(at.name.startsWith('data-')||at.name==='draggable')s.removeAttribute(at.name)});
    s.classList.remove('hot','lift');
    s.style.cssText+=`;background:none!important;border:0!important;box-shadow:none!important;outline:none!important;padding:0!important;margin:0!important;min-height:0!important;height:auto!important;overflow:visible!important;max-width:none!important;width:${a.offsetWidth}px!important`;
    cur.appendChild(s);cur=s;
  });
  const c=el.cloneNode(true);c.classList.remove('lift');c.removeAttribute('data-wdrag');c.removeAttribute('data-drag');c.removeAttribute('draggable');c.classList.add('wdcl');c.style.width=W+'px';c.style.opacity='1';c.style.margin='0';
  cur.appendChild(c);g.appendChild(inner);
  const p=document.createElement('span');p.className='wdplus';p.textContent='+';g.appendChild(p);
  g.style.transform=`translate(${r.left}px,${r.top}px)`;
  inner.style.transform='scale(1)';
  document.body.appendChild(g);
  void g.offsetWidth;
  g.style.transition='transform .2s ease-out';
  inner.style.transition='transform .2s ease-out';
  inner.style.transform='';
  wdGhostMove(x,y);
  setTimeout(()=>{if(g.isConnected&&!g._land)g.style.transition='none'},220);
}
function wdGhostMove(x,y){const g=document.getElementById('wdGhost');if(!g||g._land)return;g.style.transform=`translate(${x-g._W*.31}px,${y-g._H*.31}px)`}
function wdGhostOff(){const g=document.getElementById('wdGhost');if(g)g.remove()}
function wdGhostLand(target,cb){
  const g=document.getElementById('wdGhost');
  if(!g){if(cb)cb();return}
  g._land=true;
  const inner=g.querySelector('.wdin');
  if(target){
    /* al destino: vuela y se difumina */
    const r=target.getBoundingClientRect();
    g.style.transition='transform .2s ease-in,opacity .2s ease-in';
    g.style.transform=`translate(${r.left+r.width/2-g._W*.31}px,${r.top+r.height/2-g._H*.31}px)`;
    g.style.opacity='0';
    setTimeout(()=>{g.remove();if(cb)cb()},200);
  }else{
    /* sin destino: vuelve a su pastilla de origen, recupera su tamaño y se asienta difuminándose */
    g.style.transition='transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s ease-out';
    inner.style.transition='transform .4s cubic-bezier(.2,.8,.2,1)';
    inner.style.transform='scale(1)';
    g.style.transform=`translate(${g._ox}px,${g._oy}px)`;
    g.style.opacity='0';
    setTimeout(()=>{g.remove();if(cb)cb()},420);
  }
}

/* deslizar a la derecha para completar una tarea (To Do y calendario) */
let swDrag=null, swToast=null;
function swWrap(el){
  if(el._swWrap)return;
  const w=document.createElement('div');w.className='swwrap';
  w.style.marginBottom=getComputedStyle(el).marginBottom;
  const bg=document.createElement('div');bg.className='swbg';
  bg.innerHTML='<span>✓</span><span class="swlbl">Completado</span>';
  el.style.margin='0';
  el.parentNode.insertBefore(w,el);w.appendChild(bg);w.appendChild(el);
  el._swWrap=w;el._swBg=bg;
}
function swUnwrap(el){
  const w=el._swWrap;if(!w)return;
  el._swWrap=null;el._swBg=null;el.style.margin='';
  if(w.parentNode)w.replaceWith(el);
}
function swReset(el){
  if(!el)return;
  el.style.transform='';el.style.background='';el.removeAttribute('data-swipe');
  el.style.transition='transform .25s ease';
  if(el._swWrap)el._swWrap.style.setProperty('--swl',0);
  setTimeout(()=>{if(!swDrag||swDrag.el!==el)swUnwrap(el)},260);
}

  if(e.pointerType!=='touch'&&e.pointerType!=='mouse')return;
  if(e.pointerType==='mouse'&&e.button!==0)return;

  const oa=el.querySelector('[data-open]');if(!oa)return;

},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!swDrag||(e.pointerType!=='touch'&&e.pointerType!=='mouse'))return;
  if(wdT&&wdT.lift)return;
  const rawdx=e.clientX-swDrag.x, dy=e.clientY-swDrag.y;
  if(!swDrag.on){if(rawdx>12&&rawdx>Math.abs(dy)*1.5){swDrag.on=true;swDrag.el.style.transition='none';swDrag.el.setAttribute('data-swipe','1');if(swDrag.el.classList.contains('item'))swWrap(swDrag.el)}else return}
  const dx=Math.max(0,rawdx);

  if(swDrag.el._swWrap)swDrag.el._swWrap.style.setProperty('--swl',Math.max(0,Math.min(1,(dx-40)/50)));
},{passive:true});
document.addEventListener('click',e=>{if(Date.now()-(window.__swBlock||0)<400){e.stopPropagation();e.preventDefault()}},true);
function swEnd(){
  if(!swDrag)return;const d=swDrag;swDrag=null;if(d.on)window.__swBlock=Date.now();
