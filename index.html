<style>
*{box-sizing:border-box;touch-action:manipulation;-webkit-text-size-adjust:100%}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f1ea;color:#1c2b4a;font-size:14px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.side{width:230px;background:#f3f2ef;border-right:1px solid #e6e5e1;padding:18px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.side h2{font-size:17px;margin:4px 8px 2px}
.sync{font-size:11px;color:#9b9a97;margin:0 8px 14px}
#nav{display:flex;flex-direction:column}
.nav{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer;color:#37352f}
.nav:hover{background:#e6e5e1}
.nav.on{background:#e0dfdb;font-weight:600;box-shadow:inset 3px 0 0 #2383e2}
.nav.nueva{margin-top:14px;background:#2383e2;color:#fff;font-weight:600;text-align:center}
.main{flex:1;padding:28px 34px 90px;max-width:1120px;min-width:0}
.cover{height:120px;margin:-28px -34px 0}
.picon{width:68px;height:68px;border-radius:18px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:34px;margin:-22px 0 10px;position:relative;z-index:1}
.pbar{display:flex;gap:8px;justify-content:space-between;margin:0 0 12px;position:relative;z-index:3}
.cover.pcov{margin:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0 20px}
.pgrid .prop{display:flex;flex-direction:column;align-items:stretch;gap:4px;border:1px solid #e6e5e1;border-radius:10px;padding:10px 12px;background:#fff}
.cardbox{background:#fff;border:1px solid #e6e5e1;border-radius:12px;padding:14px 16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.dlg2{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;box-shadow:0 14px 40px rgba(0,0,0,.25);text-align:center}
.dlg2 h3{margin:0 0 6px;font-size:20px}
.fmtbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fmtb{font:inherit;font-size:16px;font-weight:600;padding:16px;border-radius:12px;border:2px solid #e6e5e1;background:#fff;cursor:pointer;color:#37352f}
.fmtb:hover{border-color:#2383e2;background:#eef5fd}
body.dark{background:#191919;color:#e8e6e1}
body.dark .side{background:#202020;border-color:#2f2f2f}
body.dark .nav{color:#e8e6e1}
body.dark .nav:hover{background:#2c2c2c}
body.dark .nav.on{background:#303030}
body.dark .item,body.dark .stat,body.dark .dc,body.dark .trow,body.dark .cardbox,body.dark .pgrid .prop,body.dark .btn,body.dark .fmtb,body.dark .dlg2{background:#232323;border-color:#333;color:#e8e6e1}
body.dark .day,body.dark .col{background:#202020}
body.dark .thead{border-color:#333}
body.dark .trow{border-color:#2c2c2c}
body.dark .trow:hover,body.dark .dc:hover{background:#2a2a2a}
body.dark .pill{background:#333;color:#e8e6e1}
body.dark .btn.on{background:#e8e6e1;color:#191919}
body.dark select,body.dark input,body.dark textarea{background:#1e1e1e;color:#e8e6e1;border-color:#333}
body.dark .mut,body.dark .stat span{color:#8a8880}
body.dark .tt,body.dark .ptitle,body.dark .body{color:#e8e6e1}
body.dark .picon{background:#232323}
body.dark .cover{opacity:.8}
body.dark .nav.nueva{color:#fff}
.wdlg{background:#fff;border-radius:18px;padding:24px;max-width:520px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.wbar{height:6px;background:#efefed;border-radius:99px;margin:10px 0 4px;overflow:hidden}
.wbar span{display:block;height:100%;background:#2383e2;border-radius:99px;transition:width .2s}
.wq{font-size:22px;margin:12px 0 4px}
.wopts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.wopt{font:inherit;padding:10px 14px;border-radius:999px;border:1px solid #e6e5e1;background:#fff;cursor:pointer;color:#37352f}
.wopt.on{background:#2383e2;color:#fff;border-color:#2383e2}
.wtxt{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #e6e5e1;border-radius:10px;margin:14px 0;box-sizing:border-box}
.wbtns{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
body.dark .wdlg{background:#232323;color:#e8e6e1}
body.dark .wopt{background:#232323;color:#e8e6e1;border-color:#333}
body.dark .wtxt{background:#1e1e1e;color:#e8e6e1;border-color:#333}
body.dark .wbar{background:#333}
.sumlist{display:grid;gap:6px;margin:12px 0}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:#f7f6f3;border-radius:10px}
body.dark .sumrow{background:#2a2a2a}
.ctx{position:fixed;background:#fff;border:1px solid #e6e5e1;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;z-index:20;min-width:230px;display:flex;flex-direction:column}
.ctx button{font:inherit;font-size:14px;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;color:#37352f}
.ctx button:hover{background:#f1f1ef}
.ctx .cxdel{color:#d44c47}
.cxrow{display:flex;flex-wrap:wrap;gap:4px;padding:6px}
.cxp{font-size:12px;border-radius:999px;padding:4px 10px;border:1px solid #e6e5e1;background:#fff}
.cxp.on{background:#2383e2;color:#fff;border-color:#2383e2}
body.dark .ctx{background:#232323;border-color:#333}
body.dark .ctx button{color:#e8e6e1}
body.dark .ctx button:hover{background:#2c2c2c}
.seg{position:relative;display:flex;width:100%;background:#efefed;border-radius:12px;padding:4px;margin:4px 0 18px;touch-action:none}
.segind{position:absolute;top:4px;bottom:4px;left:0;width:0;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .18s ease,width .18s ease}
.segb{position:relative;z-index:1;border:0;background:none;font:inherit;font-size:13px;flex:1;min-width:0;padding:8px 6px;border-radius:9px;cursor:pointer;color:#6b6a66;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:5px;row-gap:2px;white-space:nowrap;line-height:1.2}
.segb .dot{margin:0!important}
.segn{font-size:11px;color:#9b9a97}
@media(max-width:700px){.segn{flex-basis:100%;text-align:center}.segb{padding:9px 4px}}
.segb.on{color:#37352f;font-weight:600}
body.dark .seg{background:#2a2a2a}
body.dark .segind{background:#3a3a3a}
body.dark .segb{color:#8a8880}
body.dark .segb.on{color:#e8e6e1}
#main{touch-action:pan-y}
.navind{display:none;position:absolute;left:0;top:0;background:#e0dfdb;border-radius:16px;pointer-events:none;z-index:0;opacity:0;will-change:transform;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .15s}
body.dark .navind{background:#333}
@media(max-width:700px){.navind{display:block}#nav{touch-action:none}#nav .nav,#nav .nav.on{background:transparent!important;position:relative;z-index:1}}
.lift{transform:scale(1.035);box-shadow:0 12px 28px rgba(35,131,226,.28)!important;transition:transform .15s ease,box-shadow .15s ease;position:relative;z-index:2}
.dc.sel{outline:2px solid #2383e2;outline-offset:-2px}
.topbtn{position:fixed;top:14px;right:18px;z-index:12;font:inherit;font-size:14px;border:1px solid #e6e5e1;background:#fff;color:#37352f;border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06)}
body.dark .topbtn{background:#232323;color:#e8e6e1;border-color:#333}
.topbtn{padding:6px 10px;font-size:13px;top:10px;right:12px;box-shadow:none}
.ajuste{margin-top:auto;width:100%;color:#8a8880;font-size:13px}

@media(max-width:700px){.ajuste{display:none}.topbtn{background:none;border:0;box-shadow:none;padding:4px 6px;font-size:18px;color:#9b9a97;top:6px;right:8px}}
@media(max-width:700px){body.dark .topbtn{background:none;border-color:transparent}}
.fab{position:fixed;right:22px;bottom:22px;background:#2383e2;color:#fff;border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:600;box-shadow:0 6px 20px rgba(35,131,226,.35);cursor:pointer;z-index:4}
h1{font-size:32px;margin:0 0 4px;letter-spacing:-.025em;font-weight:800}
.sub{color:#9b9a97;font-size:13px;margin-bottom:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid #e0dfdb;background:#fff;cursor:pointer;color:#37352f}
.btn.on{background:#37352f;color:#fff;border-color:#37352f}
.btn.pri{background:#2383e2;color:#fff;border-color:#2383e2}
.btn.del{color:#d44c47}
.mut{color:#9b9a97;font-size:13px}
.grp{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-weight:700;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.item{background:#fff;border:1px solid #e6e5e1;border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:transform .12s,box-shadow .12s;display:flex;gap:10px;align-items:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.item.done{opacity:.5}
.item:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 20px}
.stat{background:#fff;border:1px solid #e6e5e1;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:#9b9a97}
.item .tt{font-weight:600;font-size:14.5px}
.tt{color:#37352f;text-decoration:none;cursor:pointer}
.tt:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:#efefed;color:#37352f;white-space:nowrap}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:8px;overflow-x:auto}
.day{background:#f3f2ef;border-radius:8px;padding:8px;min-height:180px}
.day h4{margin:0 0 8px;font-size:13px;color:#6b6a66;text-transform:capitalize}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:8px;overflow-x:auto}
.col{background:#f3f2ef;border-radius:8px;padding:8px;min-height:160px}
.col h4{margin:2px 2px 8px;font-size:13px;display:flex;justify-content:space-between}
.thead,.trow{display:grid;grid-template-columns:2.2fr 1.1fr 1fr 1fr;gap:10px;align-items:center;padding:10px 12px}
.thead{font-size:11px;color:#9b9a97;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e6e5e1}
.trow{border:1px solid #efefed;border-radius:12px;margin-bottom:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .12s,box-shadow .12s}
.trow:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.trow a.tt{font-weight:600}
.item,.trow,.chip,.dc,.col,.card,.tt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:12px;color:#9b9a97;font-weight:700;padding:4px}
.dc{background:#fff;border:1px solid #e6e5e1;border-radius:6px;min-height:96px;padding:6px;cursor:pointer}
.dc:hover{background:#faf9f7}
.dc .num{font-size:12px;color:#6b6a66;font-weight:700}
.chip{display:block;font-size:11px;padding:2px 6px;border-radius:4px;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.page-wrap{max-width:740px;margin:0 auto}
.ptitle{font-size:34px;font-weight:700;border:0;outline:none;width:100%;background:transparent;padding:6px 0;font-family:inherit;color:#37352f}
.prop{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #efefed}
.prop input,.prop select,.prop textarea{font:inherit;padding:6px 8px;border:1px solid #e6e5e1;border-radius:6px;width:100%;background:#fff;color:#37352f}
.body{width:100%;min-height:340px;font:inherit;font-size:15px;line-height:1.65;border:0;outline:none;resize:vertical;padding:14px 0;background:transparent;color:#37352f}

.wArrP.wtxtb{width:auto;border-radius:999px;padding:0 22px;font-size:16px;font-weight:600}
.wskip{font:inherit;font-size:15px;font-weight:600;border:0;background:#efefed;color:#37352f;padding:12px 22px;border-radius:999px;cursor:pointer}
.wx{position:absolute;top:10px;right:12px;border:0;background:none;font:inherit;font-size:20px;color:#9b9a97;cursor:pointer;padding:4px 8px}
body.dark .wArr{background:#2a2a2a;color:#e8e6e1;border-color:#3a3a3a}
body.dark .wskip{background:#2a2a2a;color:#e8e6e1}
body.dark .wx{color:#8a8880}
.wsum{font-size:13px;color:#9b9a97;text-align:center;flex:1}
.wbtns .pri{margin-left:auto}
@media(max-width:700px){.wdlg{padding:18px;max-height:90vh;overflow:auto}.wbtns{flex-wrap:wrap}.wbtns .pri{flex:1 1 100%;margin-left:0;padding:12px}.wq{font-size:20px}}

@media(max-width:700px){.side{background:#141414!important;border-top:0!important}.side .nav{color:#fff}.side .nav.on{background:rgba(255,255,255,.22)!important;box-shadow:none}.navind{background:rgba(255,255,255,.22)!important}.fab{background:#fff;color:#191919;box-shadow:0 8px 22px rgba(0,0,0,.25);margin-top:0!important;margin-bottom:0!important;align-self:center}.nav .ico{display:flex;align-items:center;justify-content:center}}
h1,h2,h3,.wq,.stat b,.picon{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}

.hero{background:#262626;color:#fff;border-radius:22px;padding:22px 22px 20px;margin:4px 0 18px;box-shadow:0 10px 26px rgba(0,0,0,.4);position:relative;overflow:hidden}.hero>*:not(.hero-face){position:relative;z-index:1}.hero-face{position:absolute!important;right:-30%;top:4px;width:70%;height:auto;opacity:.4;filter:blur(1px);pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to left,#000 70%,transparent 100%),linear-gradient(to bottom,transparent 0%,#000 25%,#000 70%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to left,#000 70%,transparent 100%),linear-gradient(to bottom,transparent 0%,#000 25%,#000 70%,transparent 100%);mask-composite:intersect}.hero-d{font-size:14px;opacity:.9;margin-bottom:6px;text-transform:capitalize}.hero-t{font-size:14px;font-weight:600;opacity:.9}.hero-n{font-family:"Space Grotesk",Inter,sans-serif;font-size:64px;font-weight:700;line-height:1;margin:8px 0 4px}.hero-s{font-size:17px;font-weight:600}.hero-bar{height:8px;background:rgba(255,255,255,.3);border-radius:8px;margin:14px 0;overflow:hidden}.hero-bar div{height:100%;background:#fff;border-radius:8px}.hero-f{font-size:14px;opacity:.92}.stats .stat b{font-family:"Space Grotesk",Inter,sans-serif;font-size:40px;line-height:1}.stats .stat span{font-size:13px}
.hero-h{font-family:"Space Grotesk",Inter,sans-serif;font-size:44px;font-weight:700;text-transform:uppercase;line-height:1;letter-spacing:-.01em;margin:0 0 14px}.hero-t{font-size:16px!important}.hero-s{font-size:20px!important;margin-top:4px}.hero-f{font-size:16px!important;line-height:1.4}
.thermo{display:flex;align-items:center;gap:12px;margin:16px 0}.tt{flex:1;height:16px;background:rgba(255,255,255,.3);border-radius:16px;overflow:hidden}.tt div{height:100%;background:#fff;border-radius:16px;transition:width .6s}.tb{min-width:64px;height:40px;padding:0 12px;border-radius:999px;background:#fff;color:#191919;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.side .nav svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h2>📅 Planificador</h2>
    <div class="sync" id="sync"></div>

    <div class="navind" id="navind"></div>
    <div id="nav"></div>
    <button class="fab" data-wstart><span class="ico">＋</span><span class="lbl"> Nueva tarea</span></button>
    
  </aside>
  <main class="main" id="main"></main>
  <button class="topbtn" data-theme id="themeBtn"></button>
  
</div>
<script>
document.addEventListener('selectstart',e=>{if(!e.target.closest||!e.target.closest('textarea,input,[contenteditable]'))e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(!e.target.closest||!e.target.closest('textarea,input,[contenteditable]'))e.preventDefault()});
const K=['t','h','g','sg','a','p','ty','pr','e','f','tv','hs','du','fr','d','n','fl','di','pu','cu','tr'];
const L={g:['Universidad','Redes','Personal','WithDesign'],sg:['🎬 Vídeos','📌 Otros','🖌️ Diseño'],a:['Inglés','Proyecto I','Infografía','Diseño crítico','Cultura visual'],p:['Alta','Media','Baja'],ty:['Obligatorio','⏩ Adelanto','Opcional','Entrega'],pr:['Idea','Por grabar','Grabado','Editado','Subido'],e:['Sin estado','Sin empezar','En curso','Listo'],f:['Reel','Carrusel'],tv:['Logo / curiosidad','Rebrand','Tipografía','Opinión','Reto','Personal']};
const PROPS=[
 {k:'t',l:'Tarea',type:'text'},{k:'h',l:'Hecho',type:'check'},
 {k:'g',l:'Grupo',type:'sel'},{k:'a',l:'Asignatura',type:'sel'},{k:'p',l:'Prioridad',type:'sel'},
 {k:'ty',l:'Tipo',type:'sel'},{k:'pr',l:'Progreso',type:'sel'},{k:'e',l:'Estado',type:'sel'},{k:'f',l:'Formato',type:'sel'},{k:'tv',l:'Tipo de vídeo',type:'sel'},
 {k:'hs',l:'Hashtags',type:'text'},{k:'du',l:'Duración',type:'text'},{k:'fr',l:'Franja',type:'text'},
 {k:'d',l:'Descripción',type:'area'},{k:'n',l:'Notas',type:'area'},
 {k:'fl',l:'Fecha límite',type:'date'},{k:'di',l:'Día',type:'date'},{k:'pu',l:'Publicación',type:'date'},
 {k:'cu',l:'Página',type:'pagina'}
];
const P={};PROPS.forEach(p=>P[p.k]=p);
const GC={Universidad:'#2383e2',Redes:'#d44c8f',Personal:'#0f7b6c',WithDesign:'#d9730d'};
const PRC={Idea:'#8e6fd6','Por grabar':'#9b9a97',Grabado:'#d9a20f',Editado:'#2383e2',Subido:'#0f7b6c'};
const SECS=[['resumen',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>`,'Resumen'],['semana',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>`,'Esta semana'],['todo',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg>`,'To Do'],['cal',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,'Calendario'],['redes',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 9h5M2 15h5M17 9h5M17 15h5"/></svg>`,'Contenido Redes'],['completado',`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4M4 4h13l-2 4 2 4H4"/></svg>`,'Completado']];

const hoyD=new Date();
let calY=hoyD.getFullYear(), calM=hoyD.getMonth();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mon=(()=>{const d=new Date(hoyD);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)})();
const sun=(()=>{const d=new Date(mon+'T12:00:00');d.setDate(d.getDate()+6);return ymd(d)})();
const hace30=ymd(new Date(Date.now()-30*864e5));

let S=[], section='resumen', page=null, redesView='tablero', showIdeas=true, askId=null, dark=false, selDay=ymd(hoyD), sync='Solo en este dispositivo', ref=null, tm=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtD(v){if(!v)return '';const dt=new Date(v.slice(0,10)+'T12:00:00');let s=dt.toLocaleDateString('es-ES',{day:'numeric',month:'short'});return s}
function opts(list,cur){return list.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}
function selInl(o,field,list){return `<select data-field="${field}" data-id="${o.id}"><option value="">—</option>${opts(list,o[field]||'')}</select>`}
function fromArr(a,i){const o={id:'r'+i};K.forEach((k,j)=>{o[k]=a[j]==null?'':a[j]});o.h=!!o.h;if(!o.tr&&o.cu&&String(o.t).startsWith('🎙️ Pendiente de resumir')){o.tr=o.cu;o.cu=''}return o}
function toArr(o){return K.map(k=>k==='h'?(o.h?1:0):(o[k]||''))}
function persist(){
  const data={rows:S.map(toArr)};
  try{localStorage.setItem('planner-v3',JSON.stringify(data))}catch(e){}
  if(sb&&sbUser)sbSave(data);
}
function saveSoon(){clearTimeout(tm);tm=setTimeout(persist,400)}
const act=()=>S.filter(o=>!o.h);
const gc=g=>GC[g]||'#9b9a97';
const ACOL={'Inglés':'#e53935','Proyecto I':'#1e63d6','Infografía':'#9334e6','Diseño crítico':'#3d9e2e','Cultura visual':'#f2b705'};
const GCAL=[{d:'2026-11-14',t:'Bermu con Jorge y Gon',h:'12:00–13:00'},{d:'2026-11-20',t:'Curso novios',h:'21:35–22:35'},{d:'2026-12-09',t:'Cumple Yerko',h:'Todo el día'}];
const PCOL={Alta:'#d44c47',Media:'#d9a20f',Baja:'#8a8880'};
const ppill=o=>o.p?`<span title="${esc(o.p)}" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${PCOL[o.p]};margin-left:4px;vertical-align:middle;align-self:center"></span>`:'';
const ccol=o=>o.g==='Universidad'&&ACOL[o.a]?ACOL[o.a]:gc(o.g);
const ticon=o=>o.g!=='Universidad'?'':o.ty==='⏩ Adelanto'?'⏩ ':o.ty==='Entrega'?'📤 ':'';
function inWeek(o){return [o.di,o.fl].some(x=>x&&x.slice(0,10)>=mon&&x.slice(0,10)<=sun)}
const byFl=(a,b)=>(a.fl||'9999').localeCompare(b.fl||'9999');

function visibleKeys(d){
  const ks=['g','t','p'];
  if(d.g==='Universidad'){ks.push('a','ty','fl','di','fr');}
  else if(d.g==='Redes'){ks.push('pr','f','tv','n'); if(d.f)ks.push('d','hs','du','pu');}
  else if(d.g){ks.push('e','fl','di');}
  if(!ks.includes('d'))ks.push('d');
  ks.push('h','cu');
  return ks;
}

function frParts(v){const [a,b]=String(v||'').split('-');return [a||'',b||'']}
function frCtl(o,id){const [a,b]=frParts(o.fr);return `<div data-frw="${id}" style="display:flex;gap:8px;align-items:center"><input type="time" data-frp="0" value="${a}" style="width:auto"><span class="mut">→</span><input type="time" data-frp="1" value="${b}" style="width:auto"></div>`}
function card(o,hora){
  return `<div class="item ${o.h?'done':''}" style="border-left:4px solid ${ccol(o)}">
    <input type="checkbox" data-h="${o.id}" ${o.h?'checked':''} style="margin-top:3px">
    <div style="flex:1;min-width:0"><a class="tt" data-open="${o.id}">${ticon(o)}${esc(o.t||'Sin título')}</a>
    <div class="meta">${o.a?`<span class="pill">${esc(o.a)}</span>`:''}${ppill(o)}${o.pr?`<span class="pill" style="background:${PRC[o.pr]||'#efefed'}22">${esc(o.pr)}</span>`:''}${o.fl&&!hora?`<span class="pill">📅 ${esc(fmtD(o.fl))}</span>`:''}${hora&&o.fr?`<span class="pill">🕒 ${esc(o.fr)}</span>`:''}</div></div></div>`;
}
function redCard(o){
  return `<div class="item ${o.h?'done':''}" style="border-left:4px solid ${PRC[o.pr]||'#c8c7c3'};display:block">
    <a class="tt" data-open="${o.id}">${esc(o.t||'Sin título')}</a>
    <div class="meta">${o.f?`<span class="pill">${esc(o.f)}</span>`:''}${o.tv?`<span class="pill">${esc(o.tv)}</span>`:''}${o.pu?`<span class="pill">📅 ${esc(fmtD(o.pu))}</span>`:''}</div>
    <div style="margin-top:8px">${selInl(o,'pr',L.pr)}</div></div>`;
}

function semanaHtml(){
  const dias=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const rows=act().filter(inWeek);
  const cols=dias.map((nombre,i)=>{
    const d=new Date(mon+'T12:00:00');d.setDate(d.getDate()+i);
    const key=ymd(d);
    const items=rows.filter(o=>((o.di||o.fl||'').slice(0,10))===key).sort((a,b)=>(a.fr||'').localeCompare(b.fr||''));
    return `<div class="day"><h4>${nombre} ${d.getDate()}</h4>${items.map(card).join('')||'<span class="mut">—</span>'}</div>`;
  }).join('');
  return `<h1>🔔 Esta semana</h1><div class="sub">Del ${fmtD(mon)} al ${fmtD(sun)}</div><div class="grid7">${cols}</div>`;
}

let todoOrden='grupo';
const todoSeg=()=>`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px"><button class="btn ${todoOrden==='grupo'?'on':''}" data-tord="grupo">Por grupo</button><button class="btn ${todoOrden==='reciente'?'on':''}" data-tord="reciente">Más recientes arriba</button></div>`;
function statsTodo(rows){const stat=(n,l,c)=>`<div class="stat"><b style="color:${c}">${n}</b><span>${l}</span></div>`;const items=[[rows.length,'pendientes','#37352f'],[rows.filter(o=>o.g==='Universidad').length,'Universidad',GC.Universidad],[rows.filter(o=>o.g==='Redes').length,'Redes',GC.Redes],[rows.filter(o=>o.g==='Personal'||o.g==='WithDesign').length,'Personal / WithDesign',GC.Personal]].filter((x,i)=>i===0||x[0]>0);return `<div class="stats">${items.map(x=>stat(x[0],x[1],x[2])).join('')}</div>`}
function recienteHtml(){
  const rows=act().filter(o=>o.pr!=='Idea').reverse();
  return `<h1>✅ To Do</h1><div class="sub">${rows.length} tareas · las últimas que añadiste, arriba</div>${todoSeg()}`+statsTodo(rows)+(rows.map(card).join('')||'<p class="mut">No tienes tareas pendientes.</p>');
}
function todoHtml(){
  if(todoOrden==='reciente')return recienteHtml();
  const rows=act().filter(o=>o.pr!=='Idea');
  const grupos=[...Object.keys(GC),''];
  const stat=(n,l,c)=>`<div class="stat"><b style="color:${c}">${n}</b><span>${l}</span></div>`;
  const statsHtml=statsTodo(rows);
  return `<h1>✅ To Do</h1><div class="sub">Pendientes por apartado · pulsa “＋ añadir” para crear en ese grupo</div>${todoSeg()}`+
    statsHtml+grupos.map(g=>{
      const list=rows.filter(o=>(o.g||'')===g).sort(byFl);
      if(!list.length)return '';
      return `<div class="grp"><span class="dot" style="background:${gc(g)}"></span>${g||'Sin grupo'} <span class="mut">${list.length}</span>
        <button class="btn" style="margin-left:auto" data-newg="${g}">＋ añadir</button></div>`+
        (list.map(card).join('')||'<p class="mut">Sin tareas.</p>');
    }).join('');
}

function calHtml(){
  const first=new Date(calY,calM,1), off=(first.getDay()+6)%7, days=new Date(calY,calM+1,0).getDate();
  let cells=['L','M','X','J','V','S','D'].map(d=>`<div class="hd">${d}</div>`).join('');
  for(let i=0;i<off;i++)cells+='<div></div>';
  const rows=act();
  for(let d=1;d<=days;d++){
    const key=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const ch=rows.filter(o=>(o.di||'').slice(0,10)===key).map(o=>`<span class="chip" data-open="${o.id}" style="--c:${ccol(o)};background:${ccol(o)}22;border-left:3px solid ${ccol(o)}">${ticon(o)}${esc(o.t||'Sin título')}</span>`).join('')
      +rows.filter(o=>(o.pu||'').slice(0,10)===key).map(o=>`<span class="chip pub" data-open="${o.id}" style="--c:#0f7b6c;background:#e7f6ec">🚀 ${esc(o.t||'')}</span>`).join('');
    cells+=`<div class="dc${key===selDay?' sel':''}" data-selday="${key}"><div class="num">${d}</div>${ch}${GCAL.filter(e=>e.d===key).map(e=>`<span class="chip gcal" style="--c:#bdbcb8;background:#f1f0ee;border-left:3px dashed #bdbcb8;color:#8a8880">${esc(e.t)}</span>`).join('')}</div>`;
  }
  const nombre=new Date(calY,calM,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  return `<h1>📆 Calendario</h1><div class="sub"><button class="btn" data-month="-1">‹</button><b style="text-transform:capitalize;color:#37352f">${esc(nombre)}</b><button class="btn" data-month="1">›</button><span>· pulsa un día para crear una tarea</span></div><div class="cal">${cells}</div>${agendaHtml()}`;
}

function agendaHtml(){
  if(!selDay)return '<p class="mut" style="margin-top:14px">Toca un día para ver sus tareas.</p>';
  const list=act().filter(o=>(o.di||'').slice(0,10)===selDay).sort((a,b)=>(a.fr||'').localeCompare(b.fr||''));
  const d=new Date(selDay+'T12:00:00');
  return `<div class="grp" style="margin-top:18px;text-transform:capitalize">${d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})} <button class="btn" style="margin-left:auto" data-newday="${selDay}">＋ tarea</button></div>`+GCAL.filter(e=>e.d===selDay).map(e=>`<div class="gev" style="margin-top:8px">📅 ${esc(e.t)} <span>${esc(e.h)}</span></div>`).join('')+(list.map(card).join('')||'<p class="mut">Nada este día.</p>');
}
function redesHtml(){
  const redes=act().filter(o=>o.g==='Redes');
  const tabs=`<div style="display:flex;gap:6px;margin:4px 0 16px"><button class="btn ${redesView==='tablero'?'on':''}" data-rv="tablero">▦ Tablero</button><button class="btn ${redesView==='tabla'?'on':''}" data-rv="tabla">☰ Tabla</button><button class="btn ${showIdeas?'on':''}" data-toggle-ideas>💡 ${showIdeas?'Ocultar ideas':'Mostrar ideas'}</button></div>`;
  let body;
  if(redesView==='tabla'){
    body=`<div class="thead"><span>Tarea</span><span>Progreso</span><span>Formato</span><span>Publicación</span></div>`+
      (L.pr.filter(p=>showIdeas||p!=='Idea').map(p=>{const rs=redes.filter(o=>o.pr===p);if(!rs.length)return '';return `<div class="grp"><span class="dot" style="background:${PRC[p]}"></span>${PRI[p]} ${p} <span class="mut">${rs.length}</span></div>`+rs.map(o=>`<div class="trow" style="border-left:4px solid ${PRC[p]}"><a class="tt" data-open="${o.id}">${esc(o.t||'Sin título')}</a><div>${selInl(o,'pr',L.pr)}</div><div>${o.f?`<span class="pill">${esc(o.f)}</span>`:'<span class="mut">—</span>'}</div><div class="mut">${esc(fmtD(o.pu))||'—'}</div></div>`).join('')}).join('')||'<p class="mut">Sin vídeos.</p>');
  } else {
    body=`<div class="kanban">${L.pr.map(col=>{
      const items=redes.filter(o=>o.pr===col && (col!=='Subido'||!o.pu||o.pu.slice(0,10)>=hace30));
      if(col==='Idea'&&!showIdeas)return '';
      const oculta=false;
      const btn=col==='Idea'?`<button class="btn" data-toggle-ideas style="padding:2px 8px;font-size:12px">${showIdeas?'ocultar':'mostrar'}</button>`:'';
      return `<div class="col" data-drop="${col}"><h4><span>${col}</span><span style="display:flex;gap:6px;align-items:center"><span class="mut">${items.length}</span>${btn}</span></h4>${oculta?`<p class="mut">${items.length} ideas ocultas</p>`:items.map(o=>`<div draggable="true" data-drag="${o.id}" style="cursor:grab">${redCard(o)}</div>`).join('')}</div>`;
    }).join('')}</div>`;
  }
  return `<h1>🎬 Contenido Redes</h1><div class="sub">@papo.designs · mantén una tarjeta y arrástrala a otra columna</div>${tabs}${body}<details style="margin-top:22px"><summary style="cursor:pointer;color:#9b9a97;font-size:13px;font-weight:600;padding:6px 0">📂 Ver contenido subido</summary>${subidosHtml().replace(/<h1>[\s\S]*?<\/div>/,'')}</details>`;
}

function subidosHtml(){
  const subs=S.filter(o=>o.g==='Redes'&&o.pr==='Subido').sort((a,b)=>(b.pu||'').localeCompare(a.pu||''));
  return `<h1>📂 Contenido subido</h1><div class="sub">${subs.length} vídeos subidos</div>`+
    `<div class="thead"><span>Tarea</span><span>Formato</span><span>Tipo de vídeo</span><span>Publicación</span></div>`+

function propRow(o,p){
  const id=o.id;
  let ctl;
  if(p.type==='check')ctl=`<input type="checkbox" data-pf="h" data-pid="${id}" ${o.h?'checked':''} style="width:18px;height:18px">`;
  else if(p.type==='sel')ctl=`<select data-pf="${p.k}" data-pid="${id}"><option value="">—</option>${opts(L[p.k],o[p.k]||'')}</select>`;
  else if(p.type==='date')ctl=`<input type="date" data-pf="${p.k}" data-pid="${id}" value="${esc((o[p.k]||'').slice(0,10))}">`;
  else if(p.k==='fr')ctl=frCtl(o,id);
  else if(p.type==='area')ctl=`<textarea rows="2" data-pf="${p.k}" data-pid="${id}">${esc(o[p.k]||'')}</textarea>`;
  else ctl=`<input type="text" data-pf="${p.k}" data-pid="${id}" value="${esc(o[p.k]||'')}">`;
  return `<div class="prop"><div class="mut">${p.l}</div><div>${ctl}</div></div>`;
}

async function startVoice(){
  closeVoice();
  document.body.insertAdjacentHTML('beforeend','<div class="ov" id="voice"><div class="dlg2"><h3>💡 Idea de contenido</h3><p class="mut" id="vhint">Mantén pulsado el micro y di tu idea</p><div id="vtxt" style="min-height:48px;text-align:left;margin:12px 0;font-size:15px;white-space:pre-wrap"></div><button id="vbtn" style="width:110px;height:110px;border-radius:50%;border:0;background:#d44c8f;color:#fff;font-size:40px;cursor:pointer;touch-action:none;user-select:none">🎙️</button><div class="wbtns" style="justify-content:center;margin-top:14px"><button class="btn" data-vcancel>Cancelar</button></div><textarea id="vman" class="wtxt" rows="3" placeholder="Escribe aquí o pulsa el micro del teclado para dictar" style="margin-top:14px"></textarea><button class="btn pri" data-vsave-manual>Guardar idea</button></div></div>');
  const btn=document.getElementById('vbtn');
  const hint=document.getElementById('vhint');
  const manual=()=>{const v=document.getElementById('vtxt');if(v)v.style.display='none';btn.style.display='none';hint.textContent='Escribe la idea abajo'};
  btn.style.webkitUserSelect='none';btn.style.userSelect='none';btn.style.webkitTouchCallout='none';btn.style.webkitTapHighlightColor='transparent';
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('selectstart',e=>e.preventDefault());
  let dict=null;
  try{dict=await claude.use('dictation')}catch(e){}
  window.voiceDict=dict;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!dict&&!SR){
    btn.style.display='none';
    document.getElementById('vtxt').innerHTML='<textarea id="vman" class="wtxt" rows="4" placeholder="Escribe tu idea..."></textarea><button class="btn pri" data-vsave-manual>Guardar idea</button>';
    hint.textContent='Tu navegador no tiene dictado. Escribe la idea aquí.';
    return;
  }
  const VS=window.VS||(window.VS={finalT:'',live:'',on:false});
  VS.finalT='';VS.live='';VS.on=false;
  const show=()=>{const el=document.getElementById('vtxt');if(el)el.textContent=(VS.finalT+VS.live).trim()};
  const finish=()=>{if(!VS.on)return;VS.on=false;const t=(VS.finalT+VS.live).trim();if(!t&&!dict){if(window.VS_manual)window.VS_manual();hint.textContent='No se ha oído nada. Escribe la idea o usa el micro del teclado';const v=document.getElementById('vman');if(v)setTimeout(()=>v.focus(),50);return}closeVoice();if(t){saveIdea(t)}};
  window.VS_show=show;window.VS_finish=finish;
  let down,up;
  if(dict){
    if(!dict._wired){dict._wired=true;
      dict.onPartial(({text})=>{VS.live=text;if(window.VS_show)window.VS_show()});
      dict.onFinal(({text})=>{VS.finalT+=text+' ';VS.live='';if(window.VS_show)window.VS_show()});
      dict.onState(({state})=>{if(state==='idle'&&window.VS_finish)window.VS_finish()});
    }
    down=e=>{e.preventDefault();VS.finalT='';VS.live='';VS.on=true;btn.style.background='#b03a78';hint.textContent='Te escucho… suelta para guardar';dict.start().catch(()=>{VS.on=false;manual()})};
    up=()=>{btn.style.background='#d44c8f';dict.stop().catch(()=>{})};
  } else {
    const rec=new SR();rec.lang='es-ES';rec.continuous=true;rec.interimResults=true;
    voiceRec=rec;
    rec.onresult=ev=>{let it='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)VS.finalT+=r[0].transcript+' ';else it+=r[0].transcript}VS.live=it;show()};
    rec.onend=finish;
    rec.onerror=e=>{const c=e&&e.error;if(c==='not-allowed'||c==='service-not-allowed'){VS.on=false;manual();return}hint.textContent=c==='network'?'Sin conexión para el dictado, escribe la idea':c==='aborted'?'Mantén pulsado un poco más':'No te he oído, prueba otra vez'};
    down=e=>{e.preventDefault();VS.finalT='';VS.live='';VS.on=true;btn.style.background='#b03a78';hint.textContent='Te escucho… suelta para guardar';window.VS_used=true;try{rec.start()}catch(err){}};
    up=()=>{btn.style.background='#d44c8f';try{rec.stop()}catch(err){}};
  }
  btn.addEventListener('pointerdown',down);
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',up);
}
document.addEventListener('click',e=>{if(e.target.closest('[data-vcancel]')&&window.voiceDict){window.voiceDict.stop().catch(()=>{})}});
</script>
</body>
</html>
